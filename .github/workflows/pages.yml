# Publishes web/ on GitHub Pages after the tests pass, at every push to main that changes the site
# or its tests. There is nothing to build: web/ is uploaded as it is.
# One-time setup in the repository: Settings → Pages → Build and deployment → Source: GitHub Actions.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time: a newer push waits for the running one instead of cutting it short.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          # No dependencies and no lockfile: nothing to cache.
          package-manager-cache: false
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5

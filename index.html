<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- GitHub Ribbon -->
    <a
      href="https://github.com/AlexZaccaria/AiPong"
      class="github-ribbon"
      aria-label="Fork me on GitHub"
      target="_blank"
      rel="noopener"
    >
      <span class="ribbon-text">Fork on GitHub</span>
      <svg
        class="ribbon-icon"
        width="16"
        height="16"
        viewBox="0 0 16 16"
        fill="currentColor"
      >
        <path
          d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
        />
      </svg>
    </a>

    <div class="game-container">
      <div class="ui-overlay">
        <div class="score">
          <span id="player1-score">0</span>
          <span class="separator">-</span>
          <span id="player2-score">0</span>
        </div>
        <div class="game-status">
          <div id="start-message" class="message">
            <h2 data-text="PONG">PONG</h2>
            <p>Move mouse to control your paddle</p>
            <p>Click to start</p>
          </div>
          <div id="pause-message" class="message hidden">
            <h2 data-text="PAUSE">PAUSE</h2>
            <p>Click to continue</p>
          </div>
          <div id="game-over" class="message hidden">
            <h2 data-text="GAME OVER">GAME OVER</h2>
            <p id="winner-text"></p>
            <p>Click to play again</p>
          </div>
        </div>
      </div>
      <canvas id="game-canvas"></canvas>
    </div>

    <div class="controls">
      <div class="controls-section game-controls">
        <button id="pause-btn" class="control-btn primary">
          <span class="btn-icon">⏸</span>
          <span class="btn-text">Pause</span>
        </button>
        <button id="reset-btn" class="control-btn secondary">
          <span class="btn-icon">🔄</span>
          <span class="btn-text">Reset</span>
        </button>
        <button id="fullscreen-btn" class="control-btn tertiary">
          <span class="btn-icon">⛶</span>
          <span class="btn-text">Fullscreen</span>
        </button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
